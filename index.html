<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계수 도서관 열람증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #dfe3d2;
    --paper: #eef0e4;
    --rule: #c3c9b0;
    --ink: #24291f;
    --ink-soft: #5d6551;
    --brass: #8f7234;
    --seal: #8e2b2b;
    --forbidden: #3d2550;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #161a14;
      --paper: #232a20;
      --rule: #3a4434;
      --ink: #e4e8d6;
      --ink-soft: #a3ab93;
      --brass: #c6a560;
      --seal: #c4524a;
      --forbidden: #a98bd0;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
    line-height: 1.75;
    padding: 20px 14px;
    display: flex;
    justify-content: center;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 520px;
    background:
      repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px),
      var(--paper);
    background-position: 0 92px;
    border: 1px solid var(--rule);
    border-left: 6px double var(--brass);
    padding: 22px 24px 24px 26px;
  }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--brass);
    padding-bottom: 8px;
    margin-bottom: 18px;
  }
  .head h1 {
    font-family: "Song Myung", serif;
    font-weight: 400;
    font-size: 1.55rem;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .floor { color: var(--brass); font-size: 0.95rem; white-space: nowrap; }
  .who { color: var(--ink-soft); font-size: 0.9rem; margin: 0; }
  .q { margin: 0 96px 18px 0; font-size: 1.05rem; }
  .q strong { font-weight: 700; }
  label { display: block; color: var(--ink-soft); font-size: 0.9rem; }
  .row { display: flex; gap: 10px; align-items: flex-end; margin-top: 2px; }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid var(--ink-soft);
    padding: 6px 2px;
  }
  input:focus { outline: none; border-bottom-color: var(--brass); }
  button {
    font: inherit;
    font-size: 0.95rem;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  button[disabled] { opacity: 0.6; cursor: default; }
  .msg { min-height: 1.75em; margin: 14px 0 0; font-size: 0.95rem; }
  .msg.err { color: var(--seal); }
  .go {
    display: inline-block;
    margin-top: 6px;
    color: var(--ink);
    font-size: 1.05rem;
    text-decoration: underline;
    text-decoration-color: var(--brass);
    text-underline-offset: 5px;
  }
  .stamp {
    position: absolute;
    top: 66px;
    right: 22px;
    width: 82px;
    height: 82px;
    border: 1.5px dashed var(--rule);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    text-align: center;
    line-height: 1.3;
  }
  .stamp.on {
    border: 3px double var(--seal);
    color: var(--seal);
    font-family: "Song Myung", serif;
    font-size: 1.15rem;
    transform: rotate(-12deg);
    animation: press 0.42s cubic-bezier(.2,1.6,.4,1);
  }
  .stamp.on.dark { border-color: var(--forbidden); color: var(--forbidden); }
  @keyframes press {
    from { transform: rotate(-12deg) scale(1.8); opacity: 0; }
    to   { transform: rotate(-12deg) scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .stamp.on { animation: none; } }
  @media (max-width: 420px) {
    .q { margin-right: 0; }
    .stamp { position: static; margin: 0 0 14px auto; width: 70px; height: 70px; }
  }
  .hidden { display: none; }
  textarea { width: 100%; font: 0.8rem/1.4 monospace; margin-top: 10px; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="head">
    <h1>세계수 도서관 열람증</h1>
    <span class="floor" id="floorName"></span>
  </div>
  <div class="stamp" id="stamp" aria-hidden="true">인장<br>자리</div>
  <p class="who">사서:</p>
  <p class="q" id="question"></p>
  <form id="form" autocomplete="off">
    <label for="answer">답</label>
    <div class="row">
      <input id="answer" name="answer" required>
      <button type="submit" id="submit">열람증 받기</button>
    </div>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script>
/* ───────── 설정 ─────────
   SITE_BASE: 노션 페이지를 웹에 게시한 뒤의 주소 앞부분.
   게시된 주소가 https://내이름.notion.site/... 라면 "https://내이름.notion.site/" 로 바꿔도 됩니다. */
const SITE_BASE = "https://www.notion.so/";

const FLOORS = {
  "1": {
    name: "1층 · 입문 서가",
    question: "다 읽으셨나요? 그럼 하나만 여쭤볼게요.<br><strong>“성황제국을 세우신, 첫 번째 성황제의 이름은 무엇인가요?”</strong>",
    stamp: "열람<br>허가", forbidden: false,
    success: "맞아요. 2층 교양 서가의 열람증이에요. 계단은 저쪽이랍니다.",
    linkText: "2층 · 교양 서가로 올라가기",
    salt: "yhodE1lQimqzAth+kIHMzw==",
    locks: [{ iv: "scxJQ+PYj2cOVsPO", ct: "MRPTlon7bM1M+ip1gi85Sypusdd0w+7OH+TzwDXhwjbyV/dd6RkpowNYAentKn7Bloh0EXifsVwsFg==" }]
  },
  "2": {
    name: "2층 · 교양 서가",
    question: "이번 질문은 조금 더 어려워요.<br><strong>“열한 분의 사자 가운데, ‘심판’의 이치를 품으신 분의 꽃은 무엇인가요?”</strong>",
    stamp: "열람<br>허가", forbidden: false,
    success: "잘 읽으셨네요. 3층 전문 서가의 열람증이에요.",
    linkText: "3층 · 전문 서가로 올라가기",
    salt: "xMyr0ZjUOW3Li32jPnRPFg==",
    locks: [{ iv: "jLJL4TWYePEbAdAq", ct: "6+Imu3QFlirpDE5ttNR/OF6DwQkbuT1y/MeDIitXswkfQH6LpZppvry9kj8aT7WfaJVfgNbXSxUp0g==" }]
  },
  "3": {
    name: "3층 · 전문 서가",
    question: "…이 위로는 층이 더 없어요. 그래도 굳이 더 알고 싶으시다면.<br><strong>“여명 수도원의 수도사들이 가장 신성히 여기는 기도, 그 첫 구절을 이어보세요.”</strong>",
    stamp: "금서", forbidden: true,
    success: "…그 기도를 어디서 들으셨어요? 저는 이 문을 열어드린 적이 없어요. 들어가셨다는 건, 저도 모르는 일로 해둘게요.",
    linkText: "문 너머로",
    salt: "BfxjoeiiCKjWqpctM5B3uA==",
    locks: [{ iv: "bweKuXHdU7874She", ct: "5Qakr0RFP/Bvwd/diiSBdRji5jpMtmcr+Sf/f4Gu4TP9k3X9Sh9pQg+n71LfnB06eyPDOj2dB5NyuA==" }]
  }
};

/* 띄어쓰기·문장부호는 무시하고 비교합니다 */
const normalize = s => s.normalize("NFC").replace(/[\s.,!?·…'"“”‘’「」『』()\-—~:;]/g, "");
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function deriveKey(salt, answer) {
  const data = new Uint8Array([...salt, ...new TextEncoder().encode(normalize(answer))]);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["encrypt", "decrypt"]);
}

async function tryUnlock(floor, answer) {
  const key = await deriveKey(fromB64(floor.salt), answer);
  for (const lock of floor.locks) {
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(lock.iv) }, key, fromB64(lock.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) { /* 이 자물쇠는 아님 */ }
  }
  return null;
}

const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

if (params.get("mode") === "make") {
  /* 관리자용: 새 질문의 자물쇠 만들기 — 주소 끝에 ?mode=make 를 붙여서 엽니다 */
  $("floorName").textContent = "관리자용";
  $("stamp").classList.add("hidden");
  $("question").innerHTML = "정답과 열어줄 노션 페이지 ID(주소 끝의 32자리)를 넣으면 FLOORS에 붙여넣을 값을 만들어 드려요.";
  $("form").innerHTML = '<label for="a">정답</label><input id="a"><label for="p" style="margin-top:12px">노션 페이지 ID</label><input id="p"><div class="row" style="margin-top:14px"><button type="submit">자물쇠 만들기</button></div><textarea id="out" rows="6" readonly></textarea>';
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(salt, $("a").value);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify({ id: $("p").value.trim() })));
    $("out").value = `salt: "${toB64(salt)}",\nlocks: [{ iv: "${toB64(iv)}", ct: "${toB64(ct)}" }]`;
  });
} else {
  const floorId = FLOORS[params.get("floor")] ? params.get("floor") : "1";
  const floor = FLOORS[floorId];
  $("floorName").textContent = floor.name;
  $("question").innerHTML = floor.question;

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const answer = $("answer").value;
    if (!normalize(answer)) return;
    $("submit").disabled = true;
    const result = await tryUnlock(floor, answer);
    $("submit").disabled = false;
    const msg = $("msg");
    if (!result) {
      msg.className = "msg err";
      msg.textContent = "열람 기록과 맞지 않는 답이에요. 이 층의 책을 다시 살펴보세요.";
      return;
    }
    const stamp = $("stamp");
    stamp.innerHTML = floor.stamp;
    stamp.classList.add("on");
    if (floor.forbidden) stamp.classList.add("dark");
    $("form").classList.add("hidden");
    msg.className = "msg";
    msg.innerHTML = "";
    const p = document.createElement("span");
    p.textContent = floor.success;
    const a = document.createElement("a");
    a.className = "go";
    a.href = SITE_BASE + result.id;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = floor.linkText;
    msg.append(p, document.createElement("br"), a);
    a.focus();
  });
}
</script>
</body>
</html>
